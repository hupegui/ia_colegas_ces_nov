<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso de Inteligencia Artificial - CES</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        ces: {
                            blue: '#00529B',
                            lightBlue: '#007ACC',
                            cyan: '#00F0FF',
                            dark: '#0B132B',
                            card: '#1C2541'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Modern Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #007ACC;
        }
        
        .fade-in {
            animation: fadeIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans overflow-x-hidden antialiased selection:bg-cyan-500 selection:text-slate-900">

    <!-- HEADER SUPERIOR -->
    <header class="h-16 border-b border-slate-800 bg-slate-950/80 backdrop-filter backdrop-blur-md sticky top-0 z-50 flex items-center justify-between px-4 md:px-8">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-cyan-500/20">
                <i class="fa-solid font-bold fa-brain"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg md:text-xl text-white flex items-center gap-2">
                    IA para Profesionales <span class="text-xs px-2 py-0.5 rounded bg-blue-500/20 text-cyan-400 border border-blue-500/30">CES</span>
                </h1>
                <p class="text-xs text-slate-400 hidden sm:block">Programa de Capacitación Institucional en Inteligencia Artificial</p>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <!-- Barra de progreso global -->
            <div class="hidden md:flex flex-col items-end mr-4">
                <span class="text-xs text-slate-400 mb-1" id="overall-progress-text">Progreso: 0 de 4 módulos</span>
                <div class="w-36 h-2 bg-slate-800 rounded-full overflow-hidden">
                    <div id="overall-progress-bar" class="h-full bg-gradient-to-r from-blue-500 to-cyan-400 w-0 transition-all duration-500"></div>
                </div>
            </div>

            <!-- Botón menú móvil -->
            <button id="mobile-menu-btn" class="md:hidden p-2 text-slate-300 hover:text-white focus:outline-none" aria-label="Abrir menú">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
        </div>
    </header>

    <!-- MAIN WRAPPER -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- SIDEBAR DE NAVEGACIÓN (Módulos) -->
        <aside id="sidebar" class="absolute md:relative z-40 w-72 h-[calc(100vh-4rem)] bg-slate-950/90 md:bg-slate-950 border-r border-slate-800 flex flex-col transition-transform duration-300 transform -translate-x-full md:translate-x-0">
            <div class="p-4 border-b border-slate-800/60">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-sm"></i>
                    <input type="text" id="search-input" placeholder="Buscar en el temario..." class="w-full bg-slate-900 text-xs text-slate-200 pl-9 pr-3 py-2.5 rounded-lg border border-slate-800 focus:outline-none focus:border-cyan-500/50 transition">
                </div>
            </div>

            <div class="px-4 py-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                Módulos del Curso
            </div>

            <nav class="flex-1 overflow-y-auto px-3 space-y-2 pb-6" id="modules-list">
                <!-- Se llena dinámicamente -->
            </nav>

            <div class="p-4 border-t border-slate-800/80 bg-slate-950/50">
                <button id="btn-welcome" onclick="showWelcome()" class="w-full py-2 px-3 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-900 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-house"></i> Vista de Inicio / Resumen
                </button>
            </div>
        </aside>

        <!-- PANEL CENTRAL DE CONTENIDO -->
        <main class="flex-1 overflow-y-auto bg-slate-900 p-4 md:p-8" id="main-content">
            <!-- El contenido dinámico de bienvenida o módulos se inyecta aquí por JS -->
        </main>

    </div>

    <!-- SCRIPT DE DATOS Y LÓGICA DE LA SPA -->
    <script>
        // ESTRUCTURA DE DATOS DE LOS MÓDULOS
        const courseData = {
            welcome: {
                title: "Bienvenido al Curso de IA para Colegas del CES",
                subtitle: "Un programa diseñado para explorar desde los conceptos fundamentales hasta la aplicación práctica y ética de la Inteligencia Artificial en nuestras disciplinas.",
                features: [
                    { icon: "fa-cubes", title: "4 Módulos Graduales", desc: "De lo conceptual a la práctica avanzada y el marco ético." },
                    { icon: "fa-microchip", title: "Enfoque Aplicado", desc: "Casos de uso directos para optimizar flujos de trabajo e investigación." },
                    { icon: "fa-scale-balanced", title: "Reflexión Crítica", desc: "Análisis de sesgos, privacidad en salud/educación y marco regulatorio." }
                ]
            },
            modules: [
                {
                    id: "mod-1",
                    number: "Módulo 1",
                    title: "Fundamentos de la IA",
                    badge: "Básico",
                    badgeColor: "bg-emerald-500/10 text-emerald-400 border-emerald-500/30",
                    icon: "fa-seedling",
                    description: "Comprensión de los pilares de la Inteligencia Artificial, evolución histórica, diferencias clave de conceptos y el panorama actual tecnológico.",
                    completed: false,
                    objectives: [
                        "Diferenciar claramente entre IA, Machine Learning (ML) y Deep Learning (DL).",
                        "Comprender la evolución histórica desde los sistemas expertos hasta los modelos generativos.",
                        "Identificar la terminología fundamental (Algoritmos, Entrenamientos, Datos, Modelos)."
                    ],
                    topics: [
                        {
                            title: "1. Introducción y Conceptos Clave",
                            detail: "Definición de Inteligencia Artificial. ¿Qué constituye 'inteligencia' computacional y cuáles son sus fronteras actuales?"
                        },
                        {
                            title: "2. Taxonomía: IA vs Machine Learning vs Deep Learning",
                            detail: "Comprender la relación de conjunto. Aprendizaje Supervisado, No Supervisado y por Refuerzo explícitamente explicados."
                        },
                        {
                            title: "3. Breve Historia y Giro de Paradigma",
                            detail: "De las reglas explícitas (Sistemas Expertos) a los modelos basados en datos masivos (Big Data + Transformers)."
                        },
                        {
                            title: "4. Ecosistema Actual de la IA",
                            detail: "Revisión de los principales actores (OpenAI, Google DeepMind, Anthropic, Meta) y su impacto en la sociedad actual."
                        }
                    ],
                    resources: [
                        { type: "Lectura", name: "Artículos introductorios sobre IA de la MIT Technology Review" },
                        { type: "Ejercicio", name: "Cuestionario interactivo sobre distinción conceptual entre ML y DL" }
                    ]
                },
                {
                    id: "mod-2",
                    number: "Módulo 2",
                    title: "Prompt Engineering y Flujos de Trabajo",
                    badge: "Intermedio",
                    badgeColor: "bg-blue-500/10 text-cyan-400 border-blue-500/30",
                    icon: "fa-terminal",
                    description: "Técnicas avanzadas de formulación de instrucciones (Prompts), uso estratégico de Grandes Modelos de Lenguaje (LLMs) y automatización de tareas en contextos profesionales.",
                    completed: false,
                    objectives: [
                        "Dominar las técnicas de Prompt Engineering para obtener respuestas precisas de los LLMs.",
                        "Integrar herramientas basadas en IA para redacción, síntesis, análisis de datos y generación de presentaciones.",
                        "Crear flujos de trabajo eficientes para entornos institucionales y académicos."
                    ],
                    topics: [
                        {
                            title: "1. Principios de Prompt Engineering",
                            detail: "Estructura óptima de un prompt: Rol, Contexto, Instrucción directa, Ejemplos (Few-shot prompting) y Formato de salida."
                        },
                        {
                            title: "2. Técnicas Avanzadas de Interacción",
                            detail: "Chain-of-Thought (Cadena de Pensamiento), Tree of Thoughts, y mitigación de alucinaciones en modelos de lenguaje."
                        },
                        {
                            title: "3. Análisis de Datos y Síntesis con LLMs",
                            detail: "Uso de herramientas como ChatGPT/Claude/Gemini para procesar grandes volúmenes de documentos, tablas y literatura científica."
                        },
                        {
                            title: "4. Automatización de Flujos Institucionales",
                            detail: "Construcción de asistentes personalizados (Custom GPTs / System Prompts) adaptados al trabajo cotidiano del CES."
                        }
                    ],
                    resources: [
                        { type: "Guía Práctica", name: "Plantillas de Prompts optimizados para síntesis de literatura y redacción de informes" },
                        { type: "Taller", name: "Laboratorio de Creación de un Asistente Personalizado" }
                    ]
                },
                {
                    id: "mod-3",
                    number: "Módulo 3",
                    title: "Agentes de IA, RAG y Arquitecturas",
                    badge: "Avanzado",
                    badgeColor: "bg-purple-500/10 text-purple-400 border-purple-500/30",
                    icon: "fa-diagram-project",
                    description: "Profundización en arquitecturas modernas: Agentes autónomos, Generación Aumentada por Recuperación (RAG), Fine-Tuning y conexión mediante APIs.",
                    completed: false,
                    objectives: [
                        "Comprender la diferencia entre un LLM simple y una arquitectura basada en RAG (Retrieval-Augmented Generation).",
                        "Conocer el funcionamiento de los Agentes de IA con capacidad de uso de herramientas externas.",
                        "Evaluar el uso de APIs, Fine-tuning y vector databases para proyectos a medida."
                    ],
                    topics: [
                        {
                            title: "1. Generación Aumentada por Recuperación (RAG)",
                            detail: "Cómo conectar modelos de lenguaje con bases de datos internas del CES sin exponer información privada. Embeddings y Vector Databases."
                        },
                        {
                            title: "2. Agentes de IA y Razonamiento",
                            detail: "Sistemas autónomos que pueden planificar, ejecutar código, realizar búsquedas y tomar decisiones secuenciales."
                        },
                        {
                            title: "3. Integración mediante APIs",
                            detail: "Fundamentos de integración tecnológica: consumo de endpoints de IA dentro de plataformas institucionales."
                        },
                        {
                            title: "4. Fine-Tuning vs RAG vs Prompting",
                            detail: "Matriz de decisión técnica: Cuándo ajustar pesos de un modelo y cuándo dotarlo de contexto externo."
                        }
                    ],
                    resources: [
                        { type: "Diagrama", name: "Mapa conceptual de Arquitectura RAG e integración de bases vectoriales" },
                        { type: "Demo", name: "Simulación de interacción con un Agente Autónomo multitarea" }
                    ]
                },
                {
                    id: "mod-4",
                    number: "Módulo 4",
                    title: "Discusión Ética y Futuro en Salud/Educación",
                    badge: "Ética & Futuro",
                    badgeColor: "bg-amber-500/10 text-amber-400 border-amber-500/30",
                    icon: "fa-scale-balanced",
                    description: "Análisis crítico sobre sesgo algorítmico, protección de datos sensibles en salud y educación, marcos regulatorios y el impacto en el empleo futuro.",
                    completed: false,
                    objectives: [
                        "Identificar y mitigar los sesgos algorítmicos y discriminación en los sistemas de IA.",
                        "Garantizar el cumplimiento estricto de la privacidad y confidencialidad de datos (especialmente en áreas médicas y educativas).",
                        "Debatir las regulaciones éticas internacionales y nacionales junto con la propiedad intelectual."
                    ],
                    topics: [
                        {
                            title: "1. Sesgo Algorítmico y Equidad",
                            detail: "Cómo los datos de entrenamiento pueden perpetuar o amplificar desigualdades sociales, clínicas y raciales."
                        },
                        {
                            title: "2. Privacidad de Datos en Salud y Educación",
                            detail: "Manejo seguro de datos de pacientes/estudiantes. Retos frente a regulaciones como HIPAA, GDPR y leyes locales de protección de datos."
                        },
                        {
                            title: "3. Propiedad Intelectual y Alucinaciones",
                            detail: "Derechos de autor en contenidos generados por IA, trazabilidad y responsabilidad legal ante errores o diagnósticos erróneos."
                        },
                        {
                            title: "4. El Futuro del Trabajo y Transformación Institucional",
                            detail: "El rol del profesional humano en la era de la IA: complementariedad, supervisión humana (Human-in-the-loop) y ética del trabajo."
                        }
                    ],
                    resources: [
                        { type: "Lectura Ética", name: "Directrices de la OMS sobre la Gobernanza e Inteligencia Artificial en Salud" },
                        { type: "Mesa Redonda", name: "Casos de estudio prácticos sobre dilemas éticos reales en el ámbito del CES" }
                    ]
                }
            ]
        };

        let currentActiveModuleId = null;

        // INICIALIZACIÓN
        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            showWelcome();
            updateProgress();

            // Toggle Sidebar en móvil
            const mobileBtn = document.getElementById('mobile-menu-btn');
            const sidebar = document.getElementById('sidebar');
            mobileBtn.addEventListener('click', () => {
                sidebar.classList.toggle('-translate-x-full');
            });

            // Buscador del temario
            document.getElementById('search-input').addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                filterSidebar(query);
            });
        });

        // RENDERIZAR LISTA DE MÓDULOS EN SIDEBAR
        function renderSidebar() {
            const container = document.getElementById('modules-list');
            container.innerHTML = courseData.modules.map(mod => `
                <button onclick="selectModule('${mod.id}')" 
                        id="nav-btn-${mod.id}"
                        class="w-full text-left p-3 rounded-xl transition duration-200 group flex items-start space-x-3 border border-transparent hover:border-slate-800 hover:bg-slate-900/60 ${currentActiveModuleId === mod.id ? 'bg-slate-900 border-cyan-500/40 text-white shadow-md shadow-cyan-500/5' : 'text-slate-400'}">
                    <div class="mt-0.5 w-8 h-8 rounded-lg ${mod.completed ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-cyan-400 group-hover:bg-cyan-500/20'} flex items-center justify-center transition flex-shrink-0">
                        <i class="fa-solid ${mod.completed ? 'fa-check' : mod.icon} text-sm"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between mb-0.5">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500 group-hover:text-cyan-400 transition">${mod.number}</span>
                            <span class="text-[10px] px-1.5 py-0.2 rounded border ${mod.badgeColor}">${mod.badge}</span>
                        </div>
                        <h2 class="text-xs font-semibold text-slate-200 truncate group-hover:text-white transition">${mod.title}</h2>
                    </div>
                </button>
            `).join('');
        }

        // MOSTRAR PANTALLA DE BIENVENIDA
        function showWelcome() {
            currentActiveModuleId = null;
            renderSidebar();
            
            // Cerrar menú móvil si está abierto
            document.getElementById('sidebar').classList.add('-translate-x-full');

            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = `
                <div class="max-w-4xl mx-auto space-y-8 fade-in">
                    <!-- Hero Banner -->
                    <div class="relative overflow-hidden rounded-2xl bg-gradient-to-r from-blue-900/40 via-slate-900 to-indigo-900/40 p-6 md:p-10 border border-slate-800 shadow-2xl">
                        <div class="absolute -right-10 -bottom-10 w-64 h-64 bg-cyan-500/10 rounded-full blur-3xl"></div>
                        <div class="relative z-10 space-y-4">
                            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/30 text-cyan-400 text-xs font-medium">
                                <i class="fa-solid fa-sparkles"></i> Capacitación para Profesionales CES
                            </div>
                            <h2 class="text-2xl md:text-4xl font-extrabold text-white leading-tight">
                                ${courseData.welcome.title}
                            </h2>
                            <p class="text-slate-300 text-sm md:text-base max-w-2xl leading-relaxed">
                                ${courseData.welcome.subtitle}
                            </p>
                            <div class="pt-4 flex flex-wrap gap-3">
                                <button onclick="selectModule('mod-1')" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 text-slate-950 font-bold text-xs md:text-sm hover:shadow-lg hover:shadow-cyan-500/20 transition flex items-center gap-2">
                                    Comenzar con Módulo 1 <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Features Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        ${courseData.welcome.features.map(f => `
                            <div class="glass-panel p-5 rounded-xl border border-slate-800 hover:border-slate-700 transition">
                                <div class="w-10 h-10 rounded-lg bg-blue-500/10 text-cyan-400 flex items-center justify-center mb-4 text-lg">
                                    <i class="fa-solid ${f.icon}"></i>
                                </div>
                                <h3 class="font-bold text-slate-100 text-sm mb-1">${f.title}</h3>
                                <p class="text-xs text-slate-400 leading-relaxed">${f.desc}</p>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Resumen de Módulos (Cards resumidas) -->
                    <div class="space-y-4 pt-4">
                        <h3 class="text-lg font-bold text-slate-200 flex items-center gap-2">
                            <i class="fa-solid fa-list-check text-cyan-400"></i> Estructura del Plan de Estudios
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${courseData.modules.map(mod => `
                                <div onclick="selectModule('${mod.id}')" class="cursor-pointer glass-panel p-5 rounded-xl border border-slate-800 hover:border-cyan-500/40 hover:bg-slate-800/60 transition group flex flex-col justify-between space-y-4">
                                    <div class="space-y-2">
                                        <div class="flex items-center justify-between">
                                            <span class="text-xs font-bold text-cyan-400 uppercase tracking-wider">${mod.number}</span>
                                            <span class="text-xs px-2 py-0.5 rounded border ${mod.badgeColor}">${mod.badge}</span>
                                        </div>
                                        <h4 class="font-bold text-slate-100 group-hover:text-cyan-300 transition text-base">${mod.title}</h4>
                                        <p class="text-xs text-slate-400 line-clamp-2">${mod.description}</p>
                                    </div>
                                    <div class="flex items-center justify-between text-xs text-slate-500 pt-2 border-t border-slate-800/60">
                                        <span>${mod.topics.length} Temas detallados</span>
                                        <span class="text-cyan-400 font-medium group-hover:translate-x-1 transition flex items-center gap-1">Ver detalles <i class="fa-solid fa-chevron-right text-[10px]"></i></span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // SELECCIONAR Y MOSTRAR MÓDULO
        function selectModule(moduleId) {
            currentActiveModuleId = moduleId;
            renderSidebar();

            // Cerrar menú móvil si está abierto
            document.getElementById('sidebar').classList.add('-translate-x-full');

            const mod = courseData.modules.find(m => m.id === moduleId);
            if (!mod) return;

            const mainContent = document.getElementById('main-content');
            
            mainContent.innerHTML = `
                <div class="max-w-4xl mx-auto space-y-6 fade-in pb-12">
                    <!-- Navegación de retorno rápida -->
                    <div class="flex items-center justify-between text-xs text-slate-400 border-b border-slate-800 pb-3">
                        <button onclick="showWelcome()" class="hover:text-cyan-400 flex items-center gap-1 transition">
                            <i class="fa-solid fa-arrow-left"></i> Volver al Inicio
                        </button>
                        <span>${mod.number} de 4</span>
                    </div>

                    <!-- Header del Módulo -->
                    <div class="glass-panel p-6 md:p-8 rounded-2xl border border-slate-800 relative overflow-hidden">
                        <div class="absolute right-4 top-4 opacity-10 text-cyan-400 text-8xl pointer-events-none">
                            <i class="fa-solid ${mod.icon}"></i>
                        </div>
                        <div class="space-y-3 relative z-10">
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="text-xs font-bold text-cyan-400 uppercase tracking-wider">${mod.number}</span>
                                <span class="text-xs px-2.5 py-0.5 rounded border ${mod.badgeColor}">${mod.badge}</span>
                            </div>
                            <h2 class="text-2xl md:text-3xl font-extrabold text-white">${mod.title}</h2>
                            <p class="text-slate-300 text-sm leading-relaxed">${mod.description}</p>
                            
                            <div class="pt-2 flex items-center gap-4">
                                <button onclick="toggleCompleted('${mod.id}')" class="px-4 py-2 rounded-xl ${mod.completed ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'} text-xs font-medium transition flex items-center gap-2">
                                    <i class="fa-solid ${mod.completed ? 'fa-circle-check text-emerald-400' : 'fa-circle'}"></i> 
                                    ${mod.completed ? 'Módulo Completado' : 'Marcar como completado'}
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Objetivos de aprendizaje -->
                    <div class="bg-slate-950/60 p-5 rounded-xl border border-slate-800/80 space-y-3">
                        <h3 class="text-sm font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-bullseye text-cyan-400"></i> Objetivos de Aprendizaje
                        </h3>
                        <ul class="space-y-2">
                            ${mod.objectives.map(obj => `
                                <li class="text-xs md:text-sm text-slate-300 flex items-start gap-2.5">
                                    <i class="fa-solid fa-check text-cyan-400 mt-1 flex-shrink-0 text-xs"></i>
                                    <span>${obj}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>

                    <!-- Temario Detallado (Acordeones / Listas) -->
                    <div class="space-y-4">
                        <h3 class="text-lg font-bold text-slate-200 flex items-center gap-2">
                            <i class="fa-solid fa-book-open text-cyan-400"></i> Temario Detallado
                        </h3>
                        <div class="space-y-3">
                            ${mod.topics.map((topic, idx) => `
                                <div class="glass-panel border border-slate-800 rounded-xl overflow-hidden">
                                    <button onclick="toggleAccordion('topic-${idx}')" class="w-full p-4 text-left font-semibold text-sm text-slate-200 hover:text-cyan-300 flex items-center justify-between transition bg-slate-900/40">
                                        <span class="flex items-center gap-2">
                                            <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
                                            ${topic.title}
                                        </span>
                                        <i id="icon-topic-${idx}" class="fa-solid fa-chevron-down text-xs text-slate-500 transition-transform duration-200"></i>
                                    </button>
                                    <div id="topic-${idx}" class="hidden p-4 pt-0 text-xs md:text-sm text-slate-400 leading-relaxed border-t border-slate-800/40 bg-slate-950/40">
                                        <p class="pt-3">${topic.detail}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Recursos Recomendados -->
                    <div class="glass-panel p-5 rounded-xl border border-slate-800 space-y-3">
                        <h3 class="text-sm font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-folder-open text-cyan-400"></i> Recursos Prácticos & Lecturas Sugeridas
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            ${mod.resources.map(res => `
                                <div class="bg-slate-900/80 p-3.5 rounded-lg border border-slate-800 flex items-center space-x-3">
                                    <div class="w-8 h-8 rounded bg-blue-500/10 text-cyan-400 flex items-center justify-center text-xs flex-shrink-0">
                                        <i class="fa-solid fa-link"></i>
                                    </div>
                                    <div class="min-w-0">
                                        <span class="text-[10px] font-bold text-cyan-400 block uppercase">${res.type}</span>
                                        <p class="text-xs text-slate-300 truncate">${res.name}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Navegación entre módulos (Anterior / Siguiente) -->
                    <div class="flex items-center justify-between pt-6 border-t border-slate-800">
                        ${getPrevModuleBtn(mod.id)}
                        ${getNextModuleBtn(mod.id)}
                    </div>
                </div>
            `;
        }

        // DESPLEGAR ACORDEÓN DE TEMAS
        function toggleAccordion(id) {
            const el = document.getElementById(id);
            const icon = document.getElementById(`icon-${id}`);
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                icon.classList.add('rotate-180');
            } else {
                el.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        }

        // MARCAR MÓDULO COMO COMPLETADO
        function toggleCompleted(moduleId) {
            const mod = courseData.modules.find(m => m.id === moduleId);
            if (mod) {
                mod.completed = !mod.completed;
                selectModule(moduleId);
                updateProgress();
            }
        }

        // ACTUALIZAR BARRA DE PROGRESO GLOBAL
        function updateProgress() {
            const completedCount = courseData.modules.filter(m => m.completed).length;
            const total = courseData.modules.length;
            const percentage = (completedCount / total) * 100;

            document.getElementById('overall-progress-text').innerText = `Progreso: ${completedCount} de ${total} módulos`;
            document.getElementById('overall-progress-bar').style.width = `${percentage}%`;
        }

        // BOTONES DE NAVEGACIÓN ANTERIOR Y SIGUIENTE
        function getPrevModuleBtn(currentId) {
            const currentIndex = courseData.modules.findIndex(m => m.id === currentId);
            if (currentIndex > 0) {
                const prev = courseData.modules[currentIndex - 1];
                return `
                    <button onclick="selectModule('${prev.id}')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium transition flex items-center gap-2">
                        <i class="fa-solid fa-chevron-left"></i> ${prev.number}: ${prev.title}
                    </button>
                `;
            }
            return `<div></div>`;
        }

        function getNextModuleBtn(currentId) {
            const currentIndex = courseData.modules.findIndex(m => m.id === currentId);
            if (currentIndex < courseData.modules.length - 1) {
                const next = courseData.modules[currentIndex + 1];
                return `
                    <button onclick="selectModule('${next.id}')" class="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs transition flex items-center gap-2">
                        ${next.number}: ${next.title} <i class="fa-solid fa-chevron-right"></i>
                    </button>
                `;
            }
            return `<div></div>`;
        }

        // FILTRAR CONTENIDOS DESDE EL BUSCADOR
        function filterSidebar(query) {
            const buttons = document.querySelectorAll('#modules-list button');
            courseData.modules.forEach(mod => {
                const btn = document.getElementById(`nav-btn-${mod.id}`);
                const matchesTitle = mod.title.toLowerCase().includes(query);
                const matchesDesc = mod.description.toLowerCase().includes(query);
                const matchesTopics = mod.topics.some(t => t.title.toLowerCase().includes(query) || t.detail.toLowerCase().includes(query));

                if (matchesTitle || matchesDesc || matchesTopics) {
                    btn.classList.remove('hidden');
                } else {
                    btn.classList.add('hidden');
                }
            });
        }
    </script>
</body>
</html>
